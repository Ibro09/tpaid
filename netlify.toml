[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
# These values are non-secret identifiers or public on-chain configuration.
# Keep credential-bearing variables (database URI, API keys, service-account
# credentials) out of this list so Netlify continues scanning them.
SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB,VITE_PONS_V2_DEPLOYMENT_BLOCK,VITE_PONS_V2_LAUNCH_BUY_ROUTER,VITE_PONS_V2_PAIR_TOKEN,VITE_PONS_V2_CREATOR_TAX_BPS"

[functions]
node_bundler = "esbuild"
external_node_modules = ["express"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
